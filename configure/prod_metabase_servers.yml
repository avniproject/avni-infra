---

- name: Configure Metabase server
  hosts: metabase_server
  become: yes
  become_user: root
  remote_user: "{{ application_user }}"
  tags:
    - metabase
  vars:
    perform_aptitude_dist_upgrade: no
  vars_files:
    - group_vars/basic_docker_vars.yml
    - group_vars/metabase_docker_vars.yml
    - group_vars/prod_vars.yml
    - group_vars/prod-secret-vars.yml.enc
  roles:
    - base
    - security
    - metabase
    # Launchpad public signup page + credential-holding service
    # (forms.avniproject.org, nginx :8090 -> service 127.0.0.1:4000), on the
    # same reporting host as Metabase.
    #
    # ONE hosted instance. It is validated against the `Avni Launchpad UAT`
    # organisation and then switched to the live one — there is no second host
    # name or port. `launchpad_forms_avni_org` is the only switch: the
    # integration user, the captcha bypass, the Bugsnag release stage and the
    # liveness ping are all derived from it, so they cannot drift apart or be
    # half-flipped.
    #   make launchpad-forms-uat-org   -> writes to Avni Launchpad UAT
    #   make launchpad-forms-prod      -> writes to Avni Launchpad (live)
    - role: launchpad_forms
      vars:
        launchpad_forms_avni_username: >-
          {{ 'launchpad-forms@launchpaduat' if launchpad_forms_avni_org == 'uat'
             else 'launchpad-forms@launchpad' }}
        launchpad_forms_avni_password: >-
          {{ launchpad_forms_uat_avni_password if launchpad_forms_avni_org == 'uat'
             else launchpad_forms_prod_avni_password }}
        # Only ever set while pointed at the UAT org. The role asserts it is
        # empty for prod — on a single instance this is a sequencing risk, not
        # a per-host constant.
        launchpad_forms_captcha_bypass_token: >-
          {{ launchpad_forms_uat_captcha_bypass_token if launchpad_forms_avni_org == 'uat'
             else '' }}
        launchpad_forms_release_stage: "{{ launchpad_forms_avni_org }}"
        # Two Bugsnag projects: Node for the service, browser for the page.
        # releaseStage (above) separates uat from prod within each.
        launchpad_forms_bugsnag_key: "{{ launchpad_forms_bugsnag_key_server }}"
        launchpad_forms_web_bugsnag_key: "{{ launchpad_forms_bugsnag_key_web }}"
        # No external liveness ping while validating — it would alert on a box
        # that is deliberately being restarted and misconfigured.
        launchpad_forms_healthcheck_url: >-
          {{ launchpad_forms_healthcheck_ping_url if launchpad_forms_avni_org == 'prod'
             else '' }}
      tags: [launchpad_forms]
