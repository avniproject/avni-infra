# Avni servers over AWS Session Manager. Installed as ~/.ssh/avni.conf;
# ~/.ssh/config must start with the line:  Include avni.conf
Host avni-staging ssh.staging.avniproject.org
  HostName i-0879e9c88952968ea
Host integration-staging int-staging.avniproject.org
  HostName i-029f9587b33d91f35
Host avni-prerelease ssh.prerelease.avniproject.org
  HostName i-0cdce9ae698eb3462
Host integration-prerelease int-prerelease.avniproject.org
  HostName i-0a357dbb9e5a91ca2
Host avni-prod ssh.prod.avniproject.org
  HostName i-07df2679f68762a68
Host integration-prod int-prod.avniproject.org
  HostName i-07e5114eea30b3b61

Match host i-0879e9c88952968ea,i-029f9587b33d91f35,i-0cdce9ae698eb3462,i-0a357dbb9e5a91ca2
  ProxyCommand ~/.ssh/avni-ssm-proxy.sh avni-nonprod %h %r
Match host i-07df2679f68762a68,i-07e5114eea30b3b61
  ProxyCommand ~/.ssh/avni-ssm-proxy.sh avni-prod %h %r
Match host i-*
  User ubuntu
  IdentityFile ~/.ssh/avni-ssm
  IdentitiesOnly yes
  StrictHostKeyChecking accept-new
  ServerAliveInterval 30
