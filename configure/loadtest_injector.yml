---
# Prepare the Gatling injector for the load-test environment.
#
#   ansible-playbook -i inventory/loadtest loadtest_injector.yml \
#     -e injector_harness_sha=$(git -C ../../avni-perf rev-parse HEAD)
#
# The harness commit is required, not defaulted. A result whose harness
# revision is unknown is not reproducible, and the sha is what gets recorded
# beside the numbers.
#
# BEFORE THIS WILL FIND A HOST
#   `enable_injector` must be true and applied. The injector is on-demand: it
#   is created for a campaign and destroyed with the environment, so the
#   dynamic inventory resolves `injectors` only while one exists. An empty run
#   here means no instance is tagged Role=injector, not a broken playbook.
#
#   Its elastic IP also has to be enrolled in BOTH the ALB security group and
#   the WAF IP set — `injector_allowed_cidrs` in terraform.tfvars. That is a
#   second allowlist entry alongside the operator's own address, and the module
#   plans to REMOVE the ingress rule if the variable is ever empty, which
#   closes the environment in silence.
#
# PUBLISHING THE HARNESS FIRST
#   This role fetches a tarball of one commit from the environment bucket
#   rather than cloning a private repo onto a disposable host. Publish it from
#   a workstation that can read the repo:
#
#     SHA=$(git -C ../../avni-perf rev-parse HEAD)
#     git -C ../../avni-perf archive --format=tar.gz --prefix='' "$SHA" \
#       | aws s3 cp - "s3://avni-loadtest-<account>/deployables/avni-perf-$SHA.tar.gz"
#
#   The instance profile's ReadDeployables statement covers the download, so
#   the injector needs no credential of its own.

- name: Prepare the Gatling injector (load test)
  hosts: injectors
  become: true
  become_user: root
  remote_user: ubuntu
  vars:
    update_apt_cache: true
    # The security role guards its hardening on `application_user != "root"`.
    # It does not create the user -- the tasks install sudo, limit su to the
    # sudo group, disallow root SSH and clear the root password -- so the value
    # only has to be something other than "root" for that to run.
    #
    # Worth running here more than anywhere else: the injector is the ONLY host
    # in this environment with a public IP, because its subnet routes at the
    # internet gateway so run traffic avoids NAT data processing charges.
    application_user: ubuntu
    install_jdk: true
  vars_files:
    - group_vars/basic_vars.yml
    - group_vars/loadtest_vars.yml
  roles:
    - base
    - security

    # JDK 17, not the openjdk-8-jdk that group_vars/basic_vars.yml sets for
    # every environment. The Gatling 3.15 Gradle plugin refuses anything older:
    # "Dependency requires at least JVM runtime version 11. This build uses a
    # Java 8 JVM."
    #
    # Set on the ROLE rather than in the play's `vars:`, because Ansible ranks
    # play vars_files ABOVE play vars -- so a play-level override is silently
    # ignored while basic_vars.yml keeps winning. Role vars outrank vars_files.
    # The Makefile's loadtest-configure-etl reaches the same place with
    # --extra-vars; this keeps the playbook correct without having to remember
    # a flag.
    #
    # basic_vars.yml is left alone deliberately: it is shared with production.
    - role: jdk
      vars:
        java_apt_package: openjdk-17-jdk
    # newrelic is deliberately absent, unlike loadtest_avni_servers.yml.
    #
    # The agent exists to attribute latency inside the system under test. The
    # injector is not under test: instrumenting it would bill a host, add an
    # agent competing for the injector's own CPU — which is the resource the
    # run depends on being unconstrained — and attribute nothing useful, since
    # Gatling already reports client-side timings in far more detail.
    - avni_injector
