# Launchpad forms (forms.avniproject.org) — PUBLIC values only.
# Both of these ship inside the JS bundle, so they are not secrets and must not
# live in the vault. The service-side reCAPTCHA secret, the Avni password, the
# Node Bugsnag key and the healthcheck ping URL are in prod-secret-vars.yml.enc.
# reCAPTCHA Enterprise. The project id and site key are public (the site key
# ships in the bundle); only the API key is a secret and lives in the vault.
# Set launchpad_forms_recaptcha_enterprise to "1" at the same time as these.
launchpad_forms_recaptcha_sitekey: "6LcpqbItAAAAAEPJERZPe6F9M5MHLJoyswcSiBI_"
# The Google Cloud project the key lives in. Recorded for reference only: the
# key pair is a classic site+secret pair (google.com/recaptcha/admin now backs
# onto Cloud but still issues a secret), and the classic siteverify path needs
# no project. Switching to the Enterprise assessment API would additionally
# need an AIza... API key in the vault as launchpad_forms_recaptcha_api_key —
# the mode only flips when project_id + sitekey + api_key are ALL set.
launchpad_forms_recaptcha_project_id: "avni-be4b7"
launchpad_forms_recaptcha_enterprise: "1"   # Enterprise key (project avni-be4b7) — api.js gives "Invalid key type"
launchpad_forms_bugsnag_key_web: "314a2520d9d181da83f3f052f8294be4"

# Secrets that do not exist yet. Declared empty here so a deploy fails on the
# launchpad_forms role's own assert (which says what to do) rather than on an
# undefined-variable error. prod-secret-vars.yml.enc loads after this file, so
# the real values override these the moment they are added to the vault.
launchpad_forms_bugsnag_key_server: ""      # needs a Node Bugsnag project
launchpad_forms_recaptcha_secret: ""        # classic v2 fallback — vault.avniproject.org, "Avni Signup Google Recaptcha"
launchpad_forms_recaptcha_api_key: ""       # reCAPTCHA Enterprise API key (Google Cloud)
launchpad_forms_prod_avni_password: ""      # prod org + integration user not created yet
