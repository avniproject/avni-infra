---

  metabase_container_name: metabase
  metabase_container_image: metabase/metabase:v0.64.4
#  Below image is for t4g instance type (arm64/v8) architecture
#  metabase_container_image: iwalucas/metabase:latest
  metabase_hostname: metabase
  metabase_container_healthcheck_cmd: "curl --fail -I http://0.0.0.0:3000/api/health || exit 1"
  metabase_container_ports_mapping: "3000:3000"
  metabase_container_env_file: "/root/metabase_docker.env"
  metabase_container_env_template_file: metabase.docker.env.template.j2
  # MB_ENCRYPTION_SECRET_KEY: Metabase encrypts stored connection details and sensitive settings with it.
  # Set as mb_encryption_secret_key in group_vars/prod-secret-vars.yml.enc (ansible-vault edit). Must match the key
  # the data was encrypted with (enabled by hand on 2026-11-10, avni-product-ops metabase incident step 26);
  # a missing or different key stops Metabase from starting. Never change it here: rotate with Metabase's
  # rotate-encryption-key command.
  metabase_container_log_driver: "json-file"
  metabase_container_log_options:
    max-file: "10"
    max-size: "10m"
  metabase_container_etc_hosts:
    serverdb.openchs.org: "3.108.111.44"
  metabase_container_runtime: "runc"

  update_apt_cache: yes
# Application settings.
  application_name: metabase
  app_description: Avni metabase server
  application_user: metabase
  application_group: metabase

# Metabase env-file properties (shared across environments)
  mb_password_complexity: "strong"
  mb_password_length: "12"
  mb_jetty_port: "3000"
  mb_db_type: "postgres"
  mb_db_port: "5432"
  java_timezone: "Asia/Kolkata"
  java_opts: "-Xmx3072m"
