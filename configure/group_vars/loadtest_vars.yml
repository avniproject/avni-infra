---
# Load-test environment.
#
# Deliberately NOT modelled on prerelease: this environment exists to be
# measured, so several values here are chosen for fidelity to production or for
# measurability rather than for economy. Every deviation from production is
# recorded in the parity report that OpenTofu renders.

env: loadtest

# --- Where things are -------------------------------------------------------
#
# The private hosted zone resolves only inside the VPC; the injector uses it as
# BASE_URL. Deploys do not use DNS at all — they reach hosts by instance ID
# through the Instance Connect Endpoint.
avni_appserver_app_url: "loadtest.avniproject.org"
etl_appserver_app_url: "loadtest.avniproject.org"
avni_base_url: "https://loadtest.avniproject.org"

# Set from the OpenTofu output `db_endpoint` (host part only).
avni_server_db_host: "{{ loadtest_db_host }}"
avni_server_db_port: "5432"
avni_server_db_schema: "public"

# The database master password is generated by AWS into Secrets Manager and
# never enters OpenTofu state. Read it at run time rather than copying it into
# a vault file — one less secret with two homes.
avni_server_db_password: >-
  {{ (lookup('amazon.aws.aws_secret', loadtest_db_secret_name,
             profile=avni_aws_profile, region=avni_aws_region) | from_json).password }}
avni_server_db_user: "openchs"

avni_aws_profile: "avni-load-test"
avni_aws_region: "ap-south-1"

# --- JVM ---------------------------------------------------------------------
#
# Heap matches production exactly. GC behaviour is load-sensitive, so a
# different heap would make results untransferable.
#
# Two additions production does not have, both deliberate:
#
#   spring.datasource.tomcat.max-active — the connection pool is unconfigured in
#   production and sits at the Tomcat JDBC default, which the harness predicts
#   is itself the first choke point. It must be a knob, not an accident. No
#   application change is needed: start.sh passes these straight to java, and
#   the spring.datasource.tomcat.* namespace is already in active use
#   (application.properties:15-17).
#
#   logging.level — AuthenticationFilter logs at INFO twice per request
#   including the full query string, which is a plausible bottleneck in its own
#   right. Chosen deliberately here rather than inherited.
#
# The New Relic javaagent is NOT optional. Production runs it and the agent
# instruments the JVM at a cost; a rig without it is measurably faster than
# production for a reason unrelated to the code under test.
loadtest_db_pool_max_active: 100
loadtest_log_level: "INFO"

avni_server_opts: >-
  -Dnewrelic.environment={{ newrelic_environment }}
  -javaagent:/opt/newrelic/newrelic.jar
  -Dspring.datasource.tomcat.max-active={{ loadtest_db_pool_max_active }}
  -Dlogging.level.org.avni={{ loadtest_log_level }}
  -Dlogging.file.name={{ avni_server_access_log_dir }}/chs.log
  -Dlogging.logback.rollingpolicy.max-file-size=5mb
  -Dlogging.logback.rollingpolicy.max-history=90
  -Xms2560m -Xmx5120m
  -XX:MaxMetaspaceSize=512m -XX:CompressedClassSpaceSize=256m
  -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath={{ avni_server_access_log_dir }}/
  -XX:ErrorFile={{ avni_server_access_log_dir }}/jvm.log
  -XX:+UseStringDeduplication -XX:-OmitStackTraceInFastThrow

etl_server_opts: >-
  -Dnewrelic.environment={{ newrelic_environment }}
  -javaagent:/opt/newrelic/newrelic.jar
  -Xms1228m -Xmx1228m
  -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=128m
  -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/log/avni-etl-service/
  -XX:ErrorFile=/var/log/avni-etl-service/jvm.log
  -XX:+UseStringDeduplication -XX:-OmitStackTraceInFastThrow

newrelic_app_name: "avni-loadtest"
newrelic_environment: "loadtest"
newrelic_agent_enabled: "true"

# --- Identity ----------------------------------------------------------------
#
# none from the start. B1 is decided and B2 — the auth-cost measurement that
# was the only reason to run Cognito here first — is deferred, so there is no
# open posture to pass through. The server authenticates from the USER-NAME
# header and skips token verification entirely.
#
# This is safe only because the environment is unreachable: no public IP, no
# inbound rule, its own AWS account. With IdpType.none anyone who can reach the
# server is whoever they claim to be.
avni_idp_type: "none"
avni_server_idp_type: "none"
avni_server_keycloak_enabled: "false"
avni_server_keycloak_url: ""
avni_server_keycloak_client_secret: ""

# --- Outbound side effects: deliberately absent ------------------------------
#
# Empty rather than omitted, so the absence is visible. The instance IAM role
# also denies SNS, SES and Pinpoint outright — MessageSenderJob runs on a fixed
# delay and sends to whatever the database says are real recipients, so config
# alone is not a sufficient control.
avni_server_msg91_authkey: ""
lahi_glific_gcp_project_id: ""
lahi_glific_gcp_dataset_name: ""
lahi_schedule_cron: "-"
avni_server_minio_enabled: "false"
avni_server_minio_url: ""
avni_server_minio_access_key: ""
avni_server_minio_secret_access_key: ""

# --- Storage -----------------------------------------------------------------
#
# A real media bucket is probably unnecessary: presigning is local and nothing
# validates the bucket's existence. What is required is a configured name and a
# populated organisation mediaDirectory.
avni_server_media_bucket_name: "avni-loadtest-media"

# The instance profile supplies credentials; there are no static keys to place.
avni_server_iam_username: ""
avni_server_iam_access_key: ""
avni_server_iam_secret_access_key: ""

# --- Host firewall -----------------------------------------------------------
#
# Narrower than production's. 22 comes through the Instance Connect Endpoint,
# 8021 from the ALB, 8023 for ETL. Nothing else has a reason to be open, and
# there is no public path to this host regardless.
ufw_allowed_ports:
  - "22"
  - "8021"
  - "8023"

# --- Remaining server settings ------------------------------------------------
avni_server_host: "localhost"
avni_server_port: "8021"
avni_server_mode: "live"
avni_server_static_content_path: "/var/www/avni_server/"
avni_server_access_log_dir: "/var/log/avni_server"
avni_server_open_redirect_url: ""
avni_server_show_sql: "false"
avni_server_cache_max_entries: "100"
avni_server_cache_ttl_seconds: "300"
avni_server_cache_max_weight: "3000"
avni_server_bugsnag_release_stage: "loadtest"
avni_server_bugsnag_api_key: ""
avni_csrf_enabled: "false"
avni_web_validhosts: ""
openchs_csp_enabled: "false"
openchs_csp_allowed_hosts: ""
avni_enhanced_validation: "false"
avni_blacklisted_urls_file_path: "/etc/avni_blacklisted_urls.json"
avni_blacklisted_urls: '["/profile/**", "/manifest.json"]'
avni_send_exception_in_response: "true"
avni_webapp_timeout: "21600"
avni_endpoint_end_of_life_1: "2099-01-01"
avni_server_legacy_longitudinal_export_limit: "30000"
avni_reporting_system_0_name: ""
avni_reporting_system_0_url: ""
avni_reporting_system_1_name: ""
avni_reporting_system_1_url: ""
avni_reporting_system_2_name: ""
avni_reporting_system_2_url: ""
avni_reporting_metabase_self_service_enabled: "false"
avni_ai_server_url: ""
avni_copilot_enabled: "false"
avni_copilot_token: ""
avni_copilot_form_validation_api_key: ""
avni_show_templates: "false"
avni_default_org_user_db_password: ""
avni_server_model_key_encryption_key: ""
avni_server_storage_credentials_key: ""
avni_server_cognito_user_pool_id: "{{ loadtest_cognito_user_pool_id | default('') }}"
avni_server_cognito_client_id: "{{ loadtest_cognito_client_id | default('') }}"

# ETL
etl_allowed_origins: "https://loadtest.avniproject.org"
bugsnag_stage: "loadtest"
scheduled_job_trigger_misfire_threshold: "4800000"
scheduled_job_repeat_interval: "360"
